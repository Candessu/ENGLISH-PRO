# Go English - construction automatique de l'APK (anglais pas à pas)
# Place ce fichier dans : .github/workflows/build.yml
# Et mets le fichier go-english.html a la racine du depot (Add file > Upload files).
name: Build Go English APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'go-english.html'

concurrency:
  group: go-english-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Récupérer le dépôt (go-english.html)
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Préparer les textes à enregistrer
        run: |
          if [ ! -f go-english.html ]; then echo "::error::Fichier go-english.html introuvable a la racine du depot. Ajoute-le avec Add file > Upload files."; exit 1; fi
          cp go-english.html app.html
          grep -q 'Anglais' app.html || { echo "::error::go-english.html ne semble pas etre le bon fichier."; exit 1; }
          cat > extract.py <<'EOF_X'
          import json, re
          h = open("app.html", encoding="utf8").read()
          def grab(name):
              i = h.index("const " + name + "=") + len("const " + name + "=")
              return json.JSONDecoder().raw_decode(h, i)[0]
          WORDS, PHRASES, STORIES = grab("WORDS"), grab("PHRASES"), grab("STORIES")
          def fnv(t):
              x = 0x811c9dc5
              for b in t.encode("utf8"):
                  x ^= b
                  x = (x * 0x01000193) & 0xffffffff
              return "%08x" % x
          T = []
          def add(t):
              t = t.strip()
              if t: T.append(t)
          hw = set()
          for grp, isw in ((WORDS, True), (PHRASES, False)):
              for g in grp:
                  for s in g["subs"]:
                      for it in s["items"]:
                          add(it[0])
                          if isw: hw.add(it[0].strip())
          for st in STORIES:
              for p in st["paras"]:
                  for s in p:
                      t = s[0]
                      if st["kind"] == "dialogue":
                          m = re.match(r"^([A-Z][\w. ]{0,24}):\s(.*)$", t, re.A)
                          if m: t = m.group(2)
                      add(t)
              for k in st["gloss"]: add(k)
          U = {}
          for t in T: U.setdefault(fnv(t), t)
          json.dump(U, open("texts.json", "w", encoding="utf8"), ensure_ascii=False)
          json.dump(sorted(hw), open("humanwords.json", "w", encoding="utf8"), ensure_ascii=False)
          print("Textes :", len(U), "; mots :", len(hw))
          EOF_X
          python3 extract.py
          cat > gen_audio.py <<'EOF_X'
          import json, os, sys, wave, subprocess
          from multiprocessing import Pool
          T = json.load(open("texts.json", encoding="utf8"))
          OUT = "audio_out"
          os.makedirs(OUT, exist_ok=True)
          MODEL = "voice.onnx"
          AF = "silenceremove=start_periods=1:start_threshold=-50dB:start_silence=0.05,areverse,silenceremove=start_periods=1:start_threshold=-50dB:start_silence=0.08,areverse,loudnorm=I=-16:TP=-1.5:LRA=11,apad=pad_dur=0.12"
          todo = [(k, t) for k, t in T.items() if not os.path.exists(os.path.join(OUT, k + ".mp3"))]
          V = None
          CFG = None

          def init():
              global V, CFG
              from piper.voice import PiperVoice
              V = PiperVoice.load(MODEL)
              try:
                  from piper import SynthesisConfig
                  CFG = SynthesisConfig(length_scale=1.05)
              except Exception:
                  CFG = None

          def synth(kt):
              k, t = kt
              wav = "/tmp/" + k + ".wav"
              try:
                  with wave.open(wav, "wb") as wf:
                      if hasattr(V, "synthesize_wav"):
                          if CFG is not None:
                              V.synthesize_wav(t, wf, syn_config=CFG)
                          else:
                              V.synthesize_wav(t, wf)
                      else:
                          V.synthesize(t, wf, length_scale=1.05)
                  subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-i", wav, "-af", AF, "-ac", "1", "-ar", "24000",
                                  "-codec:a", "libmp3lame", "-b:a", "48k", os.path.join(OUT, k + ".mp3")], check=True)
                  os.remove(wav)
                  return 1
              except Exception as e:
                  print("ERREUR", k, repr(t), e, flush=True)
                  return 0

          if __name__ == "__main__":
              print("A generer :", len(todo), "sur", len(T), flush=True)
              n = 0
              if todo:
                  with Pool(os.cpu_count() or 4, initializer=init) as p:
                      for i, r in enumerate(p.imap_unordered(synth, todo, chunksize=8)):
                          n += r
                          if i % 250 == 0:
                              print(i, "/", len(todo), flush=True)
              print("OK", n, "nouveaux ; total", len(os.listdir(OUT)), flush=True)
          EOF_X
          cat > copy_audio.py <<'EOF_X'
          import json, os, shutil
          T = json.load(open("texts.json", encoding="utf8"))
          dst = "proj/app/src/main/assets/audio"
          os.makedirs(dst, exist_ok=True)
          n = 0
          for k in T:
              src = os.path.join("audio_out", k + ".mp3")
              if os.path.exists(src) and os.path.getsize(src) > 0:
                  shutil.copy(src, dst); n += 1
          print("Sons copies dans l'APK :", n, "/", len(T))
          cp = os.path.join("audio_out", "credits_h.json")
          cred = json.load(open(cp, encoding="utf8")) if os.path.exists(cp) else {"files": {}}
          lst = []
          for k, c in sorted(cred["files"].items(), key=lambda x: x[1]["w"].lower()):
              src = os.path.join("audio_out", k + ".mp3")
              if os.path.exists(src) and os.path.getsize(src) > 0:
                  shutil.copy(src, dst); lst.append(c)
          json.dump(lst, open("proj/app/src/main/assets/credits.json", "w", encoding="utf8"), ensure_ascii=False)
          print("Voix humaines copiees :", len(lst))
          EOF_X
          cat > commons.py <<'EOF_X'
          import json, os, re, subprocess, time, html, urllib.request, urllib.parse
          W = json.load(open("humanwords.json", encoding="utf8"))
          OUT = "audio_out"
          os.makedirs(OUT, exist_ok=True)
          UA = {"User-Agent": "GoEnglishBuild/1.0 (educational offline English app; built with GitHub Actions)"}
          AF = "silenceremove=start_periods=1:start_threshold=-45dB:start_silence=0.05,areverse,silenceremove=start_periods=1:start_threshold=-45dB:start_silence=0.08,areverse,highpass=f=70,loudnorm=I=-16:TP=-1.5:LRA=11,apad=pad_dur=0.12"
          CRED = os.path.join(OUT, "credits_h.json")

          def fnv(t):
              h = 0x811c9dc5
              for b in t.strip().encode("utf8"):
                  h ^= b
                  h = (h * 0x01000193) & 0xffffffff
              return "%08x" % h

          def get(url):
              for i in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                          return r.read()
                  except Exception as e:
                      print("reessai", url[:80], e, flush=True)
                      time.sleep(3 + i * 5)
              return None

          def clean(v):
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", html.unescape(v or ""))).strip()[:90]

          cred = json.load(open(CRED, encoding="utf8")) if os.path.exists(CRED) else {"files": {}, "miss": []}
          miss = set(cred["miss"])
          todo = [w for w in W if not os.path.exists(os.path.join(OUT, "h" + fnv(w) + ".mp3")) and w not in miss]
          print("Mots a chercher sur Wikimedia Commons :", len(todo), flush=True)
          found = 0
          for i in range(0, len(todo), 50):
              batch = todo[i:i + 50]
              want = {}
              for w in batch:
                  t = "File:En-us-" + w + ".ogg"
                  want[t.replace("_", " ")] = w
              q = urllib.parse.urlencode({"action": "query", "format": "json", "formatversion": "2", "redirects": "1",
                                          "prop": "imageinfo", "iiprop": "url|extmetadata",
                                          "iiextmetadatafilter": "Artist|LicenseShortName",
                                          "titles": "|".join(want.keys())})
              raw = get("https://commons.wikimedia.org/w/api.php?" + q)
              if not raw:
                  continue
              data = json.loads(raw).get("query", {})
              alias = {}
              for n in data.get("normalized", []) + data.get("redirects", []):
                  alias[n["to"]] = alias.get(n["from"], n["from"])
              got = set()
              for pg in data.get("pages", []):
                  if pg.get("missing") or not pg.get("imageinfo"):
                      continue
                  t = pg["title"]
                  src = t
                  while src in alias:
                      src = alias[src]
                  w = want.get(src) or want.get(t)
                  if not w:
                      continue
                  ii = pg["imageinfo"][0]
                  meta = ii.get("extmetadata", {})
                  blob = get(ii["url"])
                  time.sleep(0.15)
                  if not blob:
                      continue
                  tmp = "/tmp/h.ogg"
                  open(tmp, "wb").write(blob)
                  try:
                      dur = float(subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", tmp],
                                                 capture_output=True, text=True).stdout.strip() or 0)
                      if dur <= 0.2 or dur > 4.5:
                          continue
                      k = "h" + fnv(w)
                      subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-i", tmp, "-af", AF, "-ac", "1", "-ar", "24000",
                                      "-codec:a", "libmp3lame", "-b:a", "56k", os.path.join(OUT, k + ".mp3")], check=True)
                      cred["files"][k] = {"w": w, "f": t, "a": clean(meta.get("Artist", {}).get("value")),
                                          "l": clean(meta.get("LicenseShortName", {}).get("value"))}
                      got.add(w)
                      found += 1
                  except Exception as e:
                      print("ERREUR", w, e, flush=True)
              for w in batch:
                  if w not in got and not os.path.exists(os.path.join(OUT, "h" + fnv(w) + ".mp3")):
                      cred["miss"].append(w)
              json.dump(cred, open(CRED, "w", encoding="utf8"), ensure_ascii=False)
              print(min(i + 50, len(todo)), "/", len(todo), "- voix humaines trouvees :", found, flush=True)
          print("Termine. Nouveaux enregistrements humains :", found, "; total :", len(cred["files"]), flush=True)
          EOF_X


      - name: Sons déjà générés (cache)
        uses: actions/cache@v4
        with:
          path: audio_out
          key: voices-v2-${{ hashFiles('texts.json', 'humanwords.json') }}
          restore-keys: voices-v2-

      - name: Installer la voix (Piper, anglais américain)
        continue-on-error: true
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install "piper-tts==1.2.0" || pip install piper-tts
          for v in ljspeech/high/en_US-ljspeech-high ljspeech/medium/en_US-ljspeech-medium; do
            if curl -fL -o voice.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/$v.onnx" && curl -fL -o voice.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/$v.onnx.json"; then echo "Voix : $v"; break; fi
          done

      - name: Enregistrer tous les sons (mots, phrases, lectures)
        continue-on-error: true
        timeout-minutes: 200
        run: python3 gen_audio.py

      - name: Voix humaines natives (Wikimedia Commons)
        continue-on-error: true
        timeout-minutes: 60
        run: python3 commons.py

      - name: Créer le projet Android
        run: |
          mkdir -p proj/app/src/main/java/com/goenglish/app proj/app/src/main/assets
          mkdir -p proj/app/src/main/res/mipmap-mdpi
          mkdir -p proj/app/src/main/res/mipmap-hdpi
          mkdir -p proj/app/src/main/res/mipmap-xhdpi
          mkdir -p proj/app/src/main/res/mipmap-xxhdpi
          mkdir -p proj/app/src/main/res/mipmap-xxxhdpi
          cat > proj/settings.gradle <<'EOF_X'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GoEnglish"
          include ":app"
          EOF_X
          cat > proj/build.gradle <<'EOF_X'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_X
          cat > proj/gradle.properties <<'EOF_X'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF_X
          cat > proj/app/build.gradle <<'EOF_X'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.goenglish.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.goenglish.app"
                  minSdk 21
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
              }
              signingConfigs {
                  release {
                      storeFile file("goenglish.jks")
                      storePassword "GoEnglish2026"
                      keyAlias "goenglish"
                      keyPassword "GoEnglish2026"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              androidResources {
                  noCompress 'mp3'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_X
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <application
                  android:label="Go English"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_X
          cat > proj/app/src/main/java/com/goenglish/app/MainActivity.java <<'EOF_X'
          package com.goenglish.app;

          import android.app.Activity;
          import android.content.res.AssetFileDescriptor;
          import android.media.MediaPlayer;
          import android.os.Build;
          import java.util.ArrayList;
          import java.util.HashSet;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;

          public class MainActivity extends Activity implements TextToSpeech.OnInitListener {
              private WebView web;
              private TextToSpeech tts;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  tts = new TextToSpeech(this, this);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setTextZoom(100);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.addJavascriptInterface(new Bridge(), "AndroidTTS");
                  web.addJavascriptInterface(new Audio(), "AndroidAudio");
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onInit(int status) {
                  if (status == TextToSpeech.SUCCESS && tts != null) {
                      tts.setLanguage(Locale.US);
                  }
              }

              public class Bridge {
                  @JavascriptInterface
                  public void speak(String text, float rate) {
                      if (tts == null || text == null) return;
                      float r = Math.max(0.3f, Math.min(2.0f, rate));
                      tts.setLanguage(Locale.US);
                      tts.setSpeechRate(r);
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "u" + System.currentTimeMillis());
                  }

                  @JavascriptInterface
                  public void stop() {
                      if (tts != null) tts.stop();
                  }
              }

              public class Audio {
                  private final HashSet<String> keys = new HashSet<>();
                  private final ArrayList<String> queue = new ArrayList<>();
                  private MediaPlayer mp;
                  private float speed = 1f;

                  Audio() {
                      try {
                          String[] l = getAssets().list("audio");
                          if (l != null) for (String f : l) if (f.endsWith(".mp3")) keys.add(f.substring(0, f.length() - 4));
                      } catch (Exception e) { }
                  }

                  @JavascriptInterface
                  public boolean has(String k) { return k != null && keys.contains(k); }

                  @JavascriptInterface
                  public int count() { return keys.size(); }

                  @JavascriptInterface
                  public int countHuman() {
                      int n = 0;
                      for (String k : keys) if (k.startsWith("h")) n++;
                      return n;
                  }

                  @JavascriptInterface
                  public String credits() {
                      try {
                          java.io.InputStream in = getAssets().open("credits.json");
                          java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream();
                          byte[] buf = new byte[8192];
                          int r;
                          while ((r = in.read(buf)) > 0) out.write(buf, 0, r);
                          in.close();
                          return out.toString("UTF-8");
                      } catch (Exception e) {
                          return "[]";
                      }
                  }

                  @JavascriptInterface
                  public void play(final String k, final float sp) {
                      runOnUiThread(new Runnable() { public void run() {
                          if (tts != null) tts.stop();
                          queue.clear(); speed = sp; start(k);
                      }});
                  }

                  @JavascriptInterface
                  public void playList(final String csv, final float sp) {
                      runOnUiThread(new Runnable() { public void run() {
                          if (tts != null) tts.stop();
                          queue.clear();
                          for (String s : csv.split(",")) if (s.length() > 0) queue.add(s);
                          speed = sp; next();
                      }});
                  }

                  @JavascriptInterface
                  public void stop() {
                      runOnUiThread(new Runnable() { public void run() { queue.clear(); release(); }});
                  }

                  private void next() {
                      if (queue.isEmpty()) { release(); return; }
                      start(queue.remove(0));
                  }

                  private void release() {
                      if (mp != null) {
                          try { mp.stop(); } catch (Exception e) { }
                          mp.release();
                          mp = null;
                      }
                  }

                  private void start(String k) {
                      release();
                      try {
                          AssetFileDescriptor fd = getAssets().openFd("audio/" + k + ".mp3");
                          mp = new MediaPlayer();
                          mp.setDataSource(fd.getFileDescriptor(), fd.getStartOffset(), fd.getLength());
                          fd.close();
                          mp.setOnCompletionListener(new MediaPlayer.OnCompletionListener() {
                              public void onCompletion(MediaPlayer m) { next(); }
                          });
                          mp.prepare();
                          if (Build.VERSION.SDK_INT >= 23 && Math.abs(speed - 1f) > 0.01f) {
                              mp.setPlaybackParams(mp.getPlaybackParams().setSpeed(speed));
                          }
                          mp.start();
                      } catch (Exception e) {
                          next();
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.__back&&window.__back())?'1':'0'", new ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String v) {
                          if (v == null || !v.contains("1")) finish();
                      }
                  });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (tts != null) tts.stop();
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          EOF_X
