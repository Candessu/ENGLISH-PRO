      - name: Construire l'APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp proj/app/build/outputs/apk/release/app-release.apk GoEnglish.apk

      - name: APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: GoEnglish-apk
          path: GoEnglish.apk

      - name: APK (téléchargement direct dans Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Go English 1.${{ github.run_number }}
          body: APK Go English - installe GoEnglish.apk sur ton téléphone.
          files: GoEnglish.apk
